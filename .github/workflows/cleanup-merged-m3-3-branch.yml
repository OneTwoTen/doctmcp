name: Cleanup merged M3.3 branch

on:
  push:
    paths:
      - ".github/workflows/cleanup-merged-m3-3-branch.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --show-error --output /tmp/delete-ref-response --write-out "%{http_code}" \
            --request DELETE \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/codex/m3-3-device-credential-auth")
          if [ "${status}" != "204" ] && [ "${status}" != "404" ]; then
            cat /tmp/delete-ref-response
            exit 1
          fi
