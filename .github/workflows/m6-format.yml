name: Temporary M6.6 branch formatter
on:
  push:
    branches: ["codex/m6-6-production-sqlite"]
    paths:
      - ".github/workflows/m6-format.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - run: bun run check:fix
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server
          if ! git diff --cached --quiet; then
            git commit -m "style(server): format M6.6 implementation [stylebot]"
            git push origin HEAD:codex/m6-6-production-sqlite
          fi
