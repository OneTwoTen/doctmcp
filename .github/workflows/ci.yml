name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install

      - name: Biome
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: M2 acceptance
        run: bun run test:m2

      - name: M3 device lifecycle acceptance
        run: bun run test:m3

      - name: M4 public MCP acceptance
        run: bun run test:m4

      - name: M5 pairing acceptance
        run: bun run test:m5

  shell-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install

      - name: shell.exec tests
        run: bun test apps/agent/src/shell-exec.test.ts apps/agent/src/shell-exec-hardening.test.ts

      - name: M1 local acceptance
        run: bun run test:local

      - name: M2 bridge acceptance
        run: bun run test:m2

      - name: M3 device lifecycle acceptance
        run: bun run test:m3

      - name: M4 public MCP acceptance
        run: bun run test:m4

      - name: M5 pairing acceptance
        run: bun run test:m5
