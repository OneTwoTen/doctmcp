name: Bulk artifact cleanup

on:
  workflow_dispatch:
    inputs:
      older_than_days:
        description: "Delete artifacts at least this many days old (0 = any age)"
        required: true
        type: number
        default: 7
      max_delete:
        description: "Maximum number of artifacts to delete in one run (1-5000)"
        required: true
        type: number
        default: 100
      name_contains:
        description: "Optional artifact name substring (leave empty for all names)"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Preview only; uncheck to delete artifacts"
        required: true
        type: boolean
        default: true
      confirmation:
        description: "Type DELETE when dry_run is unchecked"
        required: false
        type: string
        default: ""

permissions:
  actions: write

concurrency:
  group: artifact-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Preview or delete selected artifacts
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_OLDER_THAN_DAYS: ${{ inputs.older_than_days }}
          INPUT_MAX_DELETE: ${{ inputs.max_delete }}
          INPUT_NAME_CONTAINS: ${{ inputs.name_contains }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          api = os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
          token = os.environ["GITHUB_TOKEN"]
          age = int(os.environ["INPUT_OLDER_THAN_DAYS"])
          limit = int(os.environ["INPUT_MAX_DELETE"])
          substring = os.environ["INPUT_NAME_CONTAINS"].strip()
          dry_run = os.environ["INPUT_DRY_RUN"].lower() == "true"
          confirmation = os.environ["INPUT_CONFIRMATION"]
          current_run = int(os.environ["GITHUB_RUN_ID"])

          if age < 0 or age > 3650:
              sys.exit("older_than_days must be between 0 and 3650")
          if limit < 1 or limit > 5000:
              sys.exit("max_delete must be between 1 and 5000")
          if not dry_run and confirmation != "DELETE":
              sys.exit("Deletion requires confirmation=DELETE; nothing was deleted")

          def request(method, endpoint):
              req = urllib.request.Request(
                  api + endpoint,
                  method=method,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  body = resp.read()
                  return json.loads(body) if body else None

          # Gather the full snapshot BEFORE deleting: deleting while paginating
          # would shift page boundaries and accidentally skip artifacts.
          path = "/repos/" + urllib.parse.quote(repo, safe="/") + "/actions/artifacts"
          artifacts = []
          page = 1
          while True:
              result = request("GET", path + "?per_page=100&page=" + str(page))
              batch = result["artifacts"]
              artifacts.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          cutoff = dt.datetime.now(dt.timezone.utc) - dt.timedelta(days=age)
          candidates = []
          for artifact in artifacts:
              created = dt.datetime.fromisoformat(
                  artifact["created_at"].replace("Z", "+00:00")
              )
              if created > cutoff or artifact.get("expired", False):
                  continue
              if substring and substring not in artifact["name"]:
                  continue
              if artifact.get("workflow_run", {}).get("id") == current_run:
                  continue
              candidates.append(artifact)

          candidates.sort(key=lambda item: (item["created_at"], item["id"]))
          selected = candidates[:limit]
          size = sum(item.get("size_in_bytes", 0) for item in selected)
          print(
              f"Found {len(artifacts)} artifacts; matched {len(candidates)}; "
              f"selected {len(selected)} ({size / 1048576:.2f} MiB). "
              f"dry_run={dry_run}"
          )
          for item in selected[:30]:
              print(
                  f"  id={item['id']} name={item['name']!r} "
                  f"created={item['created_at']} size={item.get('size_in_bytes', 0)}"
              )
          if len(selected) > 30:
              print(f"  ... and {len(selected) - 30} more")

          deleted = 0
          missing = 0
          if not dry_run:
              for item in selected:
                  endpoint = path + "/" + str(item["id"])
                  try:
                      request("DELETE", endpoint)
                      deleted += 1
                  except urllib.error.HTTPError as exc:
                      if exc.code == 404:
                          missing += 1  # Already deleted by another run/user.
                      else:
                          raise
              print(f"Deleted {deleted} artifacts; already missing: {missing}")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as out:
                  out.write("## Bulk artifact cleanup\n\n")
                  out.write(f"- Mode: {'preview only' if dry_run else 'DELETE'}\n")
                  out.write(f"- Artifacts scanned: {len(artifacts)}\n")
                  out.write(f"- Matching artifacts: {len(candidates)}\n")
                  out.write(f"- Selected: {len(selected)} (~{size / 1048576:.2f} MiB)\n")
                  out.write(f"- Deleted: {deleted}\n")
                  out.write(f"- Already missing: {missing}\n")
                  out.write("\nStorage savings are estimates, not a billing adjustment.\n")
          PY
